<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24363A"/>
      <stop offset="1" stop-color="#162225"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F2EC"/>
      <stop offset="1" stop-color="#D9D6CD"/>
    </linearGradient>
    <linearGradient id="moss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FB39F"/>
      <stop offset="1" stop-color="#3E8E7E"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- grille macOS : carré arrondi de 824 px centré -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <rect x="252" y="606" width="520" height="146" rx="70" fill="url(#stone)" transform="rotate(-2 512 679)"/>
    <rect x="314" y="452" width="396" height="128" rx="62" fill="url(#stone)" transform="rotate(3 512 516)"/>
    <rect x="378" y="314" width="268" height="114" rx="56" fill="url(#moss)" transform="rotate(-4 512 371)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
